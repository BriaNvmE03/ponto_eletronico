version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ponto_eletronico_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: ponto_eletronico
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ponto_eletronico_minio
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Console Web Port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: miniopassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Serviço temporário para criar o bucket e dar permissão pública
  minio-setup:
    image: minio/mc:latest
    container_name: ponto_eletronico_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin miniopassword;
      /usr/bin/mc mb myminio/ponto-fotos --ignore-existing;
      /usr/bin/mc anonymous set public myminio/ponto-fotos;
      echo 'MinIO Bucket ponto-fotos criado e configurado como público!';
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
